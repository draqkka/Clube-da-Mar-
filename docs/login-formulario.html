<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube da Maré - Acessar</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- ===== FONTES DO GOOGLE FONTS ===== -->
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
<!-- <link href="https://fonts.googleapis.com/css2?family=NOME+DA+FONTE&display=swap" rel="stylesheet"> -->

<!-- Lista de usuários (login/senha) direto no código -->
<script src="usuarios.js"></script>
</head>
<body>

<header>
<nav class="topnav">
    <a href="login.html" class="link-sair-topo"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
    
    
</nav>
</header>

<!--
    LOGIN/CADASTRO POR PERFIL
    Esta página é genérica: o mesmo HTML serve pra Estudante, Responsável,
    Diretoria e Professor. O <script> no fim da página lê "?perfil=" na URL
    (definido pelos links em login.html) e decide:
      1) o título mostrado ("Estudante", "Diretoria", etc.);
      2) quais campos aparecem — RA/Dígito/UF para Estudante e Responsável,
         E-mail institucional para Diretoria e Professor;
      3) pra onde o botão "Acessar" manda depois de clicado:
         - Estudante/Responsável  -> index.html?acesso=negado (sem acesso à planilha)
         - Diretoria/Professor    -> a planilha no AppSheet

    IMPORTANTE: como o site é só front-end (sem servidor), este formulário
    NÃO faz autenticação de verdade — ele só decide o destino do redirecionamento
    conforme o perfil escolhido em login.html. Pra virar uma autenticação real,
    seria preciso um backend (ex.: Firebase Authentication).
-->
<main class="pagina-login">

    <div>
        <a href="index.html" class="form-login-voltar">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao site
        </a>

        <div class="login-saudacao">
            <h1 id="form-titulo">Estudante</h1>
            <p>Preencha seus dados abaixo para acessar o sistema.</p>
        </div>
    </div>

    <form class="form-login-card" id="form-acesso">

        <!--
            Campo de Estudante/Responsável — genérico (aceita RA numérico ou
            e-mail institucional, o que estiver cadastrado em usuarios.js).
            Antes eram 3 campos (RA/Dígito/UF), mas como no cadastro real às
            vezes o login é um e-mail longo, ficou mais simples e menos
            confuso ter só um campo de texto livre.
        -->
        <div id="campos-ra">
            <div class="form-login-linha">
                <input type="text" class="form-login-campo" id="campo-login-ra" placeholder="RA ou e-mail institucional">
            </div>
        </div>

        <!-- Campo de Diretoria/Professor (e-mail institucional) -->
        <div id="campos-email">
            <div class="form-login-linha">
                <input type="email" class="form-login-campo" placeholder="E-mail institucional">
            </div>
        </div>

        <div class="form-login-senha-caixa">
            <input type="password" class="form-login-campo" id="campo-senha" placeholder="Senha">
            <button type="button" class="form-login-olho" id="botao-olho" aria-label="Mostrar senha">
                <i class="fa-regular fa-eye"></i>
            </button>
        </div>

        <p class="form-login-esqueceu">
            Esqueceu a senha? <a href="#">Clique aqui</a> para saber como recuperá-la.
        </p>

        <div class="form-login-botoes">
            <a href="index.html" class="btn-form-voltar">Voltar</a>
            <button type="submit" class="btn-form-acessar">Acessar</button>
        </div>

    </form>

</main>

<script>
// Lê "?perfil=" da URL (estudante, responsavel, diretoria ou professor)
var parametros = new URLSearchParams(window.location.search);
var perfil = parametros.get('perfil') || 'estudante';

var config = {
    estudante:   { titulo: 'Estudante',   camposRA: true,  destino: 'dashboard-aluno.html' },
    responsavel: { titulo: 'Responsável', camposRA: true,  destino: 'dashboard-aluno.html' },
    diretoria:   { titulo: 'Diretoria',   camposRA: false, destino: 'dashboard-diretoria.html' },
    professor:   { titulo: 'Professor',   camposRA: false, destino: 'dashboard-professor.html' }
};

var dadosPerfil = config[perfil] || config.estudante;

document.getElementById('form-titulo').textContent = dadosPerfil.titulo;
document.getElementById('campos-ra').style.display = dadosPerfil.camposRA ? 'block' : 'none';
document.getElementById('campos-email').style.display = dadosPerfil.camposRA ? 'none' : 'block';

// Mostrar/esconder a senha ao clicar no ícone do olho
document.getElementById('botao-olho').addEventListener('click', function () {
    var campoSenha = document.getElementById('campo-senha');
    var icone = this.querySelector('i');
    var vaiMostrar = campoSenha.type === 'password';
    campoSenha.type = vaiMostrar ? 'text' : 'password';
    icone.classList.toggle('fa-eye', !vaiMostrar);
    icone.classList.toggle('fa-eye-slash', vaiMostrar);
});

// Mensagem de erro (acesso negado), criada por JS pra não mexer no CSS existente
var avisoErro = document.createElement('p');
avisoErro.className = 'form-login-erro';
avisoErro.style.color = '#ff5c5c';
avisoErro.style.textAlign = 'center';
avisoErro.style.display = 'none';
avisoErro.textContent = 'Login, senha ou perfil incorretos. Verifique seus dados e tente novamente.';
document.getElementById('form-acesso').insertBefore(avisoErro, document.querySelector('.form-login-botoes'));

var botaoAcessar = document.querySelector('.btn-form-acessar');

document.getElementById('form-acesso').addEventListener('submit', function (evento) {
    evento.preventDefault();
    avisoErro.style.display = 'none';

    var login;
    if (dadosPerfil.camposRA) {
        // Compara direto com o campo "login" de usuarios.js — pode ser
        // um RA numérico, CPF ou e-mail institucional, dependendo do que
        // foi cadastrado ali para aquela pessoa.
        login = document.getElementById('campo-login-ra').value.trim();
    } else {
        login = document.querySelector('#campos-email .form-login-campo').value.trim();
    }
    var senha = document.getElementById('campo-senha').value.trim();

    if (!login || !senha) {
        avisoErro.textContent = 'Preencha login e senha.';
        avisoErro.style.display = 'block';
        return;
    }

    botaoAcessar.disabled = true;
    botaoAcessar.textContent = 'Verificando...';

    // Busca em USUARIOS (usuarios.js) já é instantânea, mas o delay de 1s
    // abaixo é só visual — dá tempo da pessoa ver o "Verificando..." antes
    // de entrar, em vez de trocar de tela na hora.
    setTimeout(function () {
        try {
            if (typeof buscarUsuario !== 'function') {
                throw new Error('usuarios.js não foi carregado (confira se o arquivo está na mesma pasta e o nome está certo)');
            }

            var usuario = buscarUsuario(login, senha, perfil);

            if (!usuario) {
                botaoAcessar.disabled = false;
                botaoAcessar.textContent = 'Acessar';
                avisoErro.textContent = 'Login, senha ou perfil incorretos. Verifique seus dados e tente novamente.';
                avisoErro.style.display = 'block';
                return;
            }

            var turmas = String(usuario.turmas || '')
                .split(',')
                .map(function (t) { return t.trim(); })
                .filter(Boolean);

            // Guarda os dados da sessão no navegador (só nesta aba/site) pra usar
            // nas páginas seguintes sem precisar logar de novo em cada uma.
            sessionStorage.setItem('cdm_sessao', JSON.stringify({
                login: login,
                perfil: perfil,
                nome: usuario.nome,
                ra: usuario.ra,
                turmas: turmas
            }));

            window.location.href = dadosPerfil.destino;
        } catch (erro) {
            // Antes, um erro aqui deixava o botão travado em "Verificando..."
            // pra sempre, sem nenhum aviso. Agora sempre volta pro normal.
            botaoAcessar.disabled = false;
            botaoAcessar.textContent = 'Acessar';
            avisoErro.textContent = 'Erro ao verificar login: ' + erro.message;
            avisoErro.style.display = 'block';
        }
    }, 1000);
});
</script>

<script src="menu.js"></script>
</body>
</html>
