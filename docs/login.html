<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube da Maré - Selecionar Perfil</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- 🌟 BLOCO 1 — Títulos de Forte Impacto: Alfa Slab One, Fjalla One, Gravitas One -->

<!-- ✍️ BLOCO 2 — Escrita Manual Casual: Caveat, Delicious Handrawn, Permanent Marker -->
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Delicious+Handrawn&family=Permanent+Marker&display=swap" rel="stylesheet">

<!-- 🎨 BLOCO 3 — Cursivas Criativas & Retro: Lobster Two, Pacifico, Playwrite DE LA Guides -->
<link href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Pacifico&family=Playwrite+DE+LA+Guides&display=swap" rel="stylesheet">

<!-- 📜 BLOCO 4 — Caligrafia Elegante: Miss Fajardose, Petemoss, Pinyon Script, Zeyada -->
<link href="https://fonts.googleapis.com/css2?family=Miss+Fajardose&family=Petemoss&family=Pinyon+Script&family=Zeyada&display=swap" rel="stylesheet">
</head>
<body class="fonte-profissional">

<header>
<nav class="topnav">
    <a href="index.html" class="link-sair-topo"><i class="fa-solid fa-arrow-left"></i> Voltar ao site</a>
</nav>
</header>

<!--
    ESCOLHA DE PERFIL — primeira etapa do login.
    Cada item abaixo manda pra login-formulario.html?perfil=X, e é esse "X"
    que faz a página de formulário decidir o título, os campos certos e o
    dashboard de destino depois do login. Se adicionar um novo perfil no
    futuro, basta copiar um <a class="login-perfil-item"> e trocar o
    "?perfil=" e os textos.
-->
<main class="pagina-login">

    <div>
        <div class="login-saudacao">
            <h1>Selecione seu perfil</h1>
            <p>Escolha como você acessa o sistema do Clube da Maré.</p>
        </div>

        <p class="login-instrucao">Toque em uma opção abaixo para continuar.</p>

        <div class="login-perfis">
            <a href="login-formulario.html?perfil=estudante" class="login-perfil-item">
                <span class="login-perfil-rotulo">Perfil</span>
                <span class="login-perfil-nome">Estudante</span>
                <span class="login-perfil-extra"><i class="fa-solid fa-chevron-right"></i></span>
            </a>

            <a href="login-formulario.html?perfil=professor" class="login-perfil-item">
                <span class="login-perfil-rotulo">Perfil</span>
                <span class="login-perfil-nome">Professor</span>
                <span class="login-perfil-extra"><i class="fa-solid fa-chevron-right"></i></span>
            </a>

            <a href="login-formulario.html?perfil=diretoria" class="login-perfil-item">
                <span class="login-perfil-rotulo">Perfil</span>
                <span class="login-perfil-nome">Diretoria</span>
                <span class="login-perfil-extra"><i class="fa-solid fa-chevron-right"></i></span>
            </a>

            <!-- O perfil "Desenvolvedor" foi de propósito removido desta
                 lista — o acesso a ele agora é só clicando na logo do banner
                 principal (index.html), que leva direto pra
                 "login-formulario.html?perfil=desenvolvedor". -->
        </div>
    </div>

</main>

<script src="menu.js"></script>
</body>
</html>
