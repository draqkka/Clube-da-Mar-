<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube da Maré - Acessar</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- ===== FONTES DO GOOGLE FONTS ===== -->
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
<!-- <link href="https://fonts.googleapis.com/css2?family=NOME+DA+FONTE&display=swap" rel="stylesheet"> -->

</head>
<body>

<header>
<nav class="topnav">
    <a href="index.html" class="link-sair-topo"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
    
    
</nav>
</header>

<!--
    LOGIN/CADASTRO POR PERFIL
    Esta página é genérica: o mesmo HTML serve pra Estudante, Responsável,
    Diretoria e Professor. O <script> no fim da página lê "?perfil=" na URL
    (definido pelos links em login.html) e decide:
      1) o título mostrado ("Estudante", "Diretoria", etc.);
      2) quais campos aparecem — RA/Dígito/UF para Estudante e Responsável,
         E-mail institucional para Diretoria e Professor;
      3) pra onde o botão "Acessar" manda depois de clicado:
         - Estudante/Responsável  -> index.html?acesso=negado (sem acesso à planilha)
         - Diretoria/Professor    -> a planilha no AppSheet

    IMPORTANTE: como o site é só front-end (sem servidor), este formulário
    NÃO faz autenticação de verdade — ele só decide o destino do redirecionamento
    conforme o perfil escolhido em login.html. Pra virar uma autenticação real,
    seria preciso um backend (ex.: Firebase Authentication).
-->
<main class="pagina-login">

    <div>
        <a href="login.html" class="form-login-voltar">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao site
        </a>

        <div class="login-saudacao">
            <h1 id="form-titulo">Estudante</h1>
            <p>Preencha seus dados abaixo para acessar o sistema.</p>
        </div>
    </div>

    <form class="form-login-card" id="form-acesso">

        <!-- Campos de Estudante/Responsável (RA + Dígito + UF) -->
        <div id="campos-ra">
            <div class="form-login-linha">
                <input type="text" class="form-login-campo" placeholder="RA">
                <input type="text" class="form-login-campo" placeholder="Dígito" style="flex: 0 0 70px;">
                <select class="form-login-campo">
                    <option>UF</option>
                    <option>SP</option>
                    <option>RJ</option>
                    <option>MG</option>
                    <option>PR</option>
                    <option>Outro</option>
                </select>
            </div>
        </div>

        <!-- Campo de Diretoria/Professor (e-mail institucional) -->
        <div id="campos-email">
            <div class="form-login-linha">
                <input type="email" class="form-login-campo" placeholder="E-mail institucional">
            </div>
        </div>

        <div class="form-login-senha-caixa">
            <input type="password" class="form-login-campo" id="campo-senha" placeholder="Senha">
            <button type="button" class="form-login-olho" id="botao-olho" aria-label="Mostrar senha">
                <i class="fa-regular fa-eye"></i>
            </button>
        </div>

        <p class="form-login-esqueceu">
            Esqueceu a senha? <a href="#">Clique aqui</a> para saber como recuperá-la.
        </p>

        <div class="form-login-botoes">
            <a href="login.html" class="btn-form-voltar">Voltar</a>
            <button type="submit" class="btn-form-acessar">Acessar</button>
        </div>

    </form>

</main>

<script>
// Lê "?perfil=" da URL (estudante, responsavel, diretoria ou professor)
var parametros = new URLSearchParams(window.location.search);
var perfil = parametros.get('perfil') || 'estudante';

// IMPORTANTE: troque a URL abaixo pela URL real do seu app AppSheet,
// se for diferente da que já está no resto do site.
var URL_PLANILHA = 'https://www.appsheet.com/start/7458b26c-6ac5-4bbd-980f-ed5b7d7b6f94';

var config = {
    estudante:   { titulo: 'Estudante',   temAcessoPlanilha: false, camposRA: true  },
    responsavel: { titulo: 'Responsável', temAcessoPlanilha: false, camposRA: true  },
    diretoria:   { titulo: 'Diretoria',   temAcessoPlanilha: true,  camposRA: false },
    professor:   { titulo: 'Professor',   temAcessoPlanilha: true,  camposRA: false }
};

var dadosPerfil = config[perfil] || config.estudante;

document.getElementById('form-titulo').textContent = dadosPerfil.titulo;
document.getElementById('campos-ra').style.display = dadosPerfil.camposRA ? 'block' : 'none';
document.getElementById('campos-email').style.display = dadosPerfil.camposRA ? 'none' : 'block';

// Mostrar/esconder a senha ao clicar no ícone do olho
document.getElementById('botao-olho').addEventListener('click', function () {
    var campoSenha = document.getElementById('campo-senha');
    var icone = this.querySelector('i');
    var vaiMostrar = campoSenha.type === 'password';
    campoSenha.type = vaiMostrar ? 'text' : 'password';
    icone.classList.toggle('fa-eye', !vaiMostrar);
    icone.classList.toggle('fa-eye-slash', vaiMostrar);
});

// Ao clicar em "Acessar": manda pra planilha (Diretoria/Professor)
// ou pro início com o aviso de acesso restrito (Estudante/Responsável)
document.getElementById('form-acesso').addEventListener('submit', function (evento) {
    evento.preventDefault();
    if (dadosPerfil.temAcessoPlanilha) {
        window.open(URL_PLANILHA, '_blank');
    } else {
        window.location.href = 'index.html?acesso=negado';
    }
});
</script>

<script src="menu.js"></script>
</body>
</html>
