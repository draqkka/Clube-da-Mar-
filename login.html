<!-- LOGIN -->
<main class="pagina-login">

    <div class="login-saudacao">
        <h1>Olá, novamente!</h1>
        <p>Já estávamos sentindo sua falta.</p>
    </div>

    <div class="login-perfis">
        <p class="login-instrucao">Escolha abaixo um perfil para acessar.</p>

        <!--
            IMPORTANTE — leia antes de mexer nos links abaixo:
            Cada perfil tem seu próprio arquivo de login/cadastro:
              - login-estudante.html   -> depois de "Acessar", vai pra
                index.html?acesso=negado (mostra o aviso "Área restrita:
                só para autoridades da escola")
              - login-responsavel.html -> mesmo destino do Estudante
              - login-diretoria.html   -> depois de "Acessar", abre a
                planilha no AppSheet
              - login-professor.html   -> mesmo destino da Diretoria
            A URL do AppSheet fica dentro do <script> de cada um desses dois
            últimos arquivos (variável URL_PLANILHA) — troque lá se precisar.
        -->
        <a href="login-estudante.html" class="login-perfil-item">
            <span class="login-perfil-rotulo">Sou</span>
            <span class="login-perfil-nome">Estudante</span>
        </a>

        <a href="login-diretoria.html" class="login-perfil-item">
            <span class="login-perfil-rotulo">Sou</span>
            <span class="login-perfil-nome">Diretoria</span>
            <span class="login-perfil-extra">acesso via <strong>App</strong>Sheet</span>
        </a>

        <a href="login-responsavel.html" class="login-perfil-item">
            <span class="login-perfil-rotulo">Sou</span>
            <span class="login-perfil-nome">Responsável</span>
        </a>

        <a href="login-professor.html" class="login-perfil-item">
            <span class="login-perfil-rotulo">Sou</span>
            <span class="login-perfil-nome">Professor</span>
            <span class="login-perfil-extra">acesso via <strong>App</strong>Sheet</span>
        </a>
    </div>

</main>

</body>
</html>
