<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clube da Maré - Login</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- ===== FONTES DO GOOGLE FONTS ===== -->
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
<!-- <link href="https://fonts.googleapis.com/css2?family=NOME+DA+FONTE&display=swap" rel="stylesheet"> -->

</head>
<body>

<header>
<nav class="topnav">
    <a href="index.html" class="link-sair-topo"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
    
</nav>
</header>

<!-- LOGIN -->
<main class="pagina-login">

    <div class="login-saudacao">
        <h1>Olá, novamente!</h1>
        <p>Já estávamos sentindo sua falta.</p>
    </div>

    <div class="login-perfis">
        <p class="login-instrucao">Escolha abaixo um perfil para acessar.</p>

        <!--
            IMPORTANTE — leia antes de mexer nos links abaixo:
            Os 4 perfis levam pra "login-formulario.html?perfil=...", uma tela
            de cadastro/login (RA+UF+Senha ou E-mail+Senha) antes do destino
            final. É a MESMA página pra todo mundo — o que muda é só o "?perfil="
            no final do link. Dentro de login-formulario.html tem um <script> que
            lê esse parâmetro e decide os campos certos e o que acontece quando a
            pessoa clica em "Acessar":
              - Estudante / Responsável -> depois de "Acessar", vai pra
                index.html?acesso=negado (index.html mostra o aviso
                "Área restrita: só para autoridades da escola")
              - Diretoria / Professor   -> depois de "Acessar", abre a planilha
                no AppSheet (a URL do AppSheet fica configurada dentro de
                login-formulario.html, não aqui)
        -->
        <a href="login-formulario.html?perfil=estudante" class="login-perfil-item">
            <span class="login-perfil-rotulo">Sou</span>
            <span class="login-perfil-nome">Estudante</span>
        </a>

        <a href="login-formulario.html?perfil=diretoria" class="login-perfil-item">
            <span class="login-perfil-rotulo">Sou</span>
            <span class="login-perfil-nome">Diretoria</span>
            <span class="login-perfil-extra">acesso via <strong>App</strong>Sheet</span>
        </a>

        <a href="login-formulario.html?perfil=responsavel" class="login-perfil-item">
            <span class="login-perfil-rotulo">Sou</span>
            <span class="login-perfil-nome">Responsável</span>
        </a>

        <a href="login-formulario.html?perfil=professor" class="login-perfil-item">
            <span class="login-perfil-rotulo">Sou</span>
            <span class="login-perfil-nome">Professor</span>
            <span class="login-perfil-extra">acesso via <strong>App</strong>Sheet</span>
        </a>
    </div>

</main>

<script src="menu.js"></script>
</body>
</html>
